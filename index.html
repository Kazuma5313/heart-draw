<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="親子でエピソードを話して、トレカにして集める対話カードゲーム。">
<meta property="og:title" content="ハートドロー">
<meta property="og:description" content="親子でエピソードを話して、トレカにして集める対話カードゲーム。">
</head>
<body>
<title>ハートドロー</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Chakra+Petch:wght@600;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* レイアウト: ダーク基調の1カラム。主役はカード（実物のトレカと同じ 63:88）。上に「いまの段階」、下に操作ボタン */
:root{
  color-scheme:dark;
  --bg:#0A0D1C; --bg2:#121735; --panel:#161B3A; --panel2:#1E2550; --line:#2C3470;
  --fg:#F3F5FF; --fg-soft:#A6AED6; --fg-dim:#6E77A8;
  --gold:#FFD23F; --gold2:#FF9F1C; --gold-ink:#1B1400;
  --rN:#A9B2D6; --rR:#4FA3FF; --rSR:#FFD23F; --rUR:#FF4DD2;
  --glow:#4FA3FF;
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-tech:"Chakra Petch","Zen Kaku Gothic New",monospace;
}
html,body{height:100%}
body{background:
   radial-gradient(120% 60% at 50% -10%,color-mix(in srgb,var(--glow) 28%,transparent),transparent 70%),
   radial-gradient(80% 50% at 100% 100%,#2A1760 0,transparent 70%),var(--bg);
  background-attachment:fixed;color:var(--fg);font-family:var(--f-body);font-weight:500;font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;transition:background .6s}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:16px;padding-block:14px 32px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;line-height:1.25;letter-spacing:.02em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:12px}
.screen{display:flex;flex-direction:column;gap:16px}
.soft{color:var(--fg-soft)} .small{font-size:13px} .center{text-align:center}
.tech{font-family:var(--f-tech);letter-spacing:.08em}

/* ボタン */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 22px;border-radius:14px;
  font-weight:900;font-size:17px;background:var(--panel2);border:1px solid var(--line);transition:transform .08s,filter .2s}
.btn:active{transform:scale(.97)}
.btn.go{background:linear-gradient(180deg,var(--gold),var(--gold2));color:var(--gold-ink);border:0;box-shadow:0 0 0 1px #FFE89A inset,0 8px 24px color-mix(in srgb,var(--gold2) 40%,transparent)}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap} .row>.btn{flex:1 1 140px;padding:0 12px;white-space:nowrap}
.link{font-size:14px;font-weight:700;color:var(--fg-soft);padding:8px 2px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:40px}

/* ホーム */
.logo{display:grid;justify-items:center;gap:4px;text-align:center;padding-top:8px}
.logo .en{font-family:var(--f-tech);font-size:13px;letter-spacing:.4em;color:var(--gold)}
.logo h1{font-size:clamp(44px,13vw,68px);background:linear-gradient(180deg,#fff 30%,#B9C2FF);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(120,140,255,.45))}
.logo p{color:var(--fg-soft);font-size:15px}
.fan{position:relative;height:clamp(250px,72vw,310px);display:flex;justify-content:center;align-items:flex-end;margin-top:6px;overflow:hidden;padding-top:10px}
.fan .ecard{position:absolute;width:clamp(120px,34vw,150px);bottom:14px;transform-origin:50% 120%}
.fan .ecard:nth-child(1){transform:rotate(-14deg) translateX(-62%)}
.fan .ecard:nth-child(2){transform:rotate(14deg) translateX(62%)}
.fan .ecard:nth-child(3){transform:translateY(-16px);z-index:2;width:clamp(132px,38vw,165px)}

/* パネル */
.panel{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:12px}
.panel h2{font-size:20px}
.steps{display:grid;gap:14px;margin:0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.steps .n{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-tech);font-size:13px;line-height:1.1;text-align:center;background:var(--panel2);border:1px solid var(--line);color:var(--gold)}
.steps b{font-weight:900;font-size:17px;display:block}
.rtable{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.rtable div{border-radius:10px;padding:8px 2px;background:var(--panel2);border:1px solid var(--line);display:grid;gap:0}
.rtable b{font-family:var(--f-tech);font-size:18px}
.rtable span{font-size:11px;color:var(--fg-soft)}

/* セットアップ */
.players{display:grid;gap:10px}
.player{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center}
.player .dot{width:14px;height:14px;border-radius:4px;transform:rotate(45deg)}
.player input{min-width:0;width:100%;font:inherit;font-weight:700;font-size:17px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--fg)}
.x{width:40px;height:40px;border-radius:10px;font-size:20px;color:var(--fg-soft)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{border:1px solid var(--line);border-radius:14px;padding:10px 4px;background:var(--bg2);display:grid;gap:2px;text-align:center}
.seg button b{font-family:var(--f-display);font-weight:400;font-size:17px}
.seg button span{font-size:12px;color:var(--fg-soft)}
.seg button[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset,0 0 18px rgba(255,210,63,.25)}

/* プレイ上部：いまの段階 */
.hud{display:grid;gap:10px}
.stepper{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stepper span{font-family:var(--f-tech);font-size:12px;font-weight:700;letter-spacing:.1em;text-align:center;padding:6px 0;border-radius:8px;background:var(--panel);border:1px solid var(--line);color:var(--fg-dim)}
.stepper span small{display:block;font-family:var(--f-body);letter-spacing:0;font-size:11px;font-weight:700}
.stepper span.on{color:var(--gold-ink);background:linear-gradient(180deg,var(--gold),var(--gold2));border-color:transparent}
.stepper span.done{color:var(--fg-soft)}
.mission{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--fg-soft);flex-wrap:wrap}
.mission b{color:var(--fg)}
.turn{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.turn h2{font-size:clamp(26px,7.5vw,34px)}
.turn .tech{color:var(--fg-dim);font-size:13px}

/* 引くカード */
.draws{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dcol{display:grid;gap:6px;min-width:0}
.dcard{perspective:1000px;aspect-ratio:63/88;width:100%;max-width:100%}
.dcard .inner{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.35,1.5,.5,1);transform-style:preserve-3d}
.dcard.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;container-type:inline-size}
.back{background:
   repeating-linear-gradient(45deg,rgba(255,255,255,.04) 0 2px,transparent 2px 12px),
   radial-gradient(circle at 50% 45%,var(--bk) 0,#0B0F26 70%);
  border:2px solid color-mix(in srgb,var(--bk) 60%,#fff);display:grid;place-items:center;align-content:center;gap:6cqw;
  box-shadow:0 0 0 4px #0B0F26,0 10px 30px rgba(0,0,0,.5)}
.back .emb{width:46cqw;aspect-ratio:1;border-radius:50%;border:2px solid rgba(255,255,255,.7);display:grid;place-items:center;font-family:var(--f-display);font-size:20cqw;color:#fff;
  background:conic-gradient(from 0deg,transparent 0 20deg,rgba(255,255,255,.1) 20deg 40deg,transparent 40deg 60deg,rgba(255,255,255,.1) 60deg 80deg,transparent 80deg);box-shadow:0 0 24px var(--bk)}
.back .lab{font-family:var(--f-tech);font-weight:700;letter-spacing:.3em;font-size:8cqw;color:#fff}
.back .q{font-size:7cqw;font-weight:900;color:rgba(255,255,255,.8)}
.dcard:not(.flipped) .back{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 4px #0B0F26,0 0 34px var(--bk)}}
.front{transform:rotateY(180deg);background:linear-gradient(160deg,var(--c),var(--c2));padding:3.5cqw;box-shadow:0 0 0 4px #0B0F26,0 0 30px color-mix(in srgb,var(--c) 60%,transparent)}
.front .in{height:100%;border-radius:9px;background:rgba(8,10,30,.55);display:grid;grid-template-rows:auto 1fr auto;padding:6cqw 5cqw;text-align:center;gap:2cqw}
.front .kind{font-family:var(--f-tech);font-weight:700;font-size:7cqw;letter-spacing:.25em;color:rgba(255,255,255,.75)}
.front .big{display:grid;place-items:center;font-size:36cqw;line-height:1;filter:drop-shadow(0 6px 16px rgba(0,0,0,.4))}
.front .glyph{font-family:var(--f-display);color:#fff;font-size:30cqw;text-shadow:0 0 20px var(--c)}
.front .word{font-family:var(--f-display);font-size:12.5cqw;line-height:1.2;color:#fff;word-break:keep-all;overflow-wrap:anywhere}
.front .en{font-family:var(--f-tech);font-size:7cqw;letter-spacing:.2em;color:rgba(255,255,255,.8)}
.redraw{font-size:13px;font-weight:700;color:var(--fg-soft);padding:6px;border:1px dashed var(--line);border-radius:10px}

.odai{border-radius:18px;padding:16px;text-align:center;display:grid;gap:6px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 22%,var(--panel)),var(--panel));border:1px solid color-mix(in srgb,var(--c) 60%,var(--line))}
.odai .lead{font-family:var(--f-tech);font-size:12px;letter-spacing:.25em;color:var(--fg-soft)}
.odai .q{font-family:var(--f-display);font-size:clamp(22px,6.4vw,30px);line-height:1.35}
.odai .q .x{color:var(--fg-dim);font-size:.7em;padding:0 4px}
.odai .q .e{color:var(--c);text-shadow:0 0 18px color-mix(in srgb,var(--c) 60%,transparent)}
.odai .h{font-size:14px;color:var(--fg-soft)}

.skill{border-radius:18px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;
  background:linear-gradient(135deg,#2B1B5E,#16123A);border:1px solid #6B4BFF;box-shadow:0 0 24px rgba(107,75,255,.35);animation:slidein .5s cubic-bezier(.3,1.4,.5,1) both}
.skill .ic{grid-row:span 2;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-tech);font-weight:700;font-size:11px;letter-spacing:.1em;background:#6B4BFF;color:#fff;text-align:center;line-height:1.1}
.skill h3{font-size:19px}
.skill p{font-size:14px;color:#D9D2FF}
.skill .tag{font-family:var(--f-tech);font-size:11px;letter-spacing:.2em;color:#B7A6FF}
@keyframes slidein{from{transform:translateY(16px) scale(.96);opacity:0}}

/* トーク */
.meter{display:grid;gap:8px;padding:14px;border-radius:18px;background:var(--panel);border:1px solid var(--line)}
.meter .bar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.meter .bar span{font-family:var(--f-tech);font-weight:700;font-size:15px;text-align:center;padding:8px 0;border-radius:10px;background:var(--bg2);color:var(--fg-dim);border:1px solid var(--line);transition:all .3s}
.meter .bar span.on{color:#0B0E1A;border-color:transparent}
.meter .bar span.on.t0{background:var(--rN)} .meter .bar span.on.t1{background:var(--rR)}
.meter .bar span.on.t2{background:var(--rSR)} .meter .bar span.on.t3{background:var(--rUR)}
.meter .bar span.cur{transform:scale(1.06);box-shadow:0 0 18px currentColor}
.meter .msg{font-weight:900;text-align:center}
.meter .msg em{font-style:normal;color:var(--gold)}
.sec{display:grid;gap:8px}
.sec h3{font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:700;font-size:15px;text-align:left}
.chip.done{background:color-mix(in srgb,var(--rR) 22%,var(--panel));border-color:var(--rR);color:var(--fg-soft)}
.chip.done::before{content:"✓ ";color:var(--rR);font-weight:900}
.chip.own{border-style:dashed;color:var(--gold)}
.timer{font-family:var(--f-tech);font-weight:700;font-size:52px;text-align:center;font-variant-numeric:tabular-nums}
.timer.low{color:#FF4D6D}
.boost{border:1px solid #6B4BFF;background:linear-gradient(135deg,#2B1B5E,#16123A);color:#fff}
.boost.got{border-color:var(--gold);color:var(--gold)}

/* カード化 */
.namebox{display:grid;gap:8px}
.namebox input{font:inherit;font-family:var(--f-display);font-size:22px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);color:var(--fg);width:100%;min-width:0}
.namebox input::placeholder{color:var(--fg-dim);font-family:var(--f-body);font-size:16px;font-weight:700}
.reveal{display:grid;justify-items:center;gap:14px;padding-top:4px}
.stage{width:min(78vw,300px);max-width:100%;position:relative}
.seal{aspect-ratio:63/88;width:100%;border-radius:16px;display:grid;place-items:center;align-content:center;gap:10px;cursor:pointer;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 2px,transparent 2px 12px),radial-gradient(circle at 50% 40%,var(--rc),#0B0F26 75%);
  border:2px solid var(--rc);box-shadow:0 0 0 5px #0B0F26,0 0 50px var(--rc);animation:shake var(--sp) ease-in-out infinite}
.seal .t{font-family:var(--f-tech);font-weight:700;letter-spacing:.3em;font-size:14px}
.seal .b{font-family:var(--f-display);font-size:26px}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(calc(var(--amp)*-1))}75%{transform:rotate(var(--amp))}}
.rname{font-family:var(--f-tech);font-weight:700;font-size:clamp(28px,9vw,40px);letter-spacing:.12em;text-align:center;animation:zoom .6s cubic-bezier(.3,1.6,.5,1) both;line-height:1.1}
.rname small{display:block;font-family:var(--f-body);font-size:14px;letter-spacing:0;color:var(--fg-soft);font-weight:700;margin-top:6px}
@keyframes zoom{from{transform:scale(2.2);opacity:0}}
.flash{position:fixed;inset:0;background:radial-gradient(circle,#fff,var(--rc) 40%,transparent 70%);pointer-events:none;z-index:60;animation:flash .8s ease-out forwards}
@keyframes flash{from{opacity:1}to{opacity:0}}
.popin{animation:popin .7s cubic-bezier(.3,1.5,.5,1) both}
@keyframes popin{from{transform:scale(.4) rotateY(90deg);opacity:0}}

/* 開封演出 */
.fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:65}
.rv-dim{position:fixed;inset:0;z-index:30;background:radial-gradient(circle at 50% 45%,transparent 0,rgba(3,4,12,.75) 55%,rgba(3,4,12,.95));pointer-events:none;animation:fadein .4s both}
.rv-dim.black{background:#000;transition:background .15s}
@keyframes fadein{from{opacity:0}}
.reveal .stage{z-index:31}
.seal.charging{animation:shake .08s linear infinite;--amp:2.5deg;transform-origin:50% 60%;transition:box-shadow .2s,border-color .2s;box-shadow:0 0 0 5px #0B0F26,0 0 70px var(--rc),0 0 140px var(--rc)}
.seal.charging .b{animation:pulse .3s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.15);text-shadow:0 0 20px var(--rc)}}
.seal .cr{position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;background:
  linear-gradient(62deg,transparent 48.6%,#fff 49.6%,#fff 50.4%,transparent 51.4%),
  linear-gradient(-35deg,transparent 48.8%,#fff 49.6%,#fff 50.4%,transparent 51.2%),
  linear-gradient(15deg,transparent 48.8%,#fff 49.7%,#fff 50.3%,transparent 51.2%);filter:drop-shadow(0 0 6px var(--rc)) drop-shadow(0 0 14px var(--rc));transition:opacity .2s}
.seal[data-lv="2"] .cr{opacity:.55}.seal[data-lv="3"] .cr,.seal[data-lv="4"] .cr{opacity:1}
.seal{position:relative;overflow:hidden}
.qmark{position:fixed;inset:0;z-index:66;display:grid;place-items:center;font-family:var(--f-display);font-size:30vmin;color:#fff;pointer-events:none;animation:qm .6s steps(6) both}
@keyframes qm{0%{opacity:0;transform:scale(.6)}30%{opacity:1}60%{opacity:.3;transform:scale(1.05) skewX(-8deg)}80%{opacity:1}100%{opacity:1;transform:scale(1.25)}}
.app.shake{animation:scr .55s cubic-bezier(.36,.07,.19,.97)}
@keyframes scr{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(5px,-3px)}30%,50%,70%{transform:translate(-9px,4px)}40%,60%{transform:translate(9px,-4px)}}
.reveal{position:relative}
.rbig{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-family:var(--f-tech);font-weight:700;font-size:min(62vw,300px);line-height:1;color:transparent;-webkit-text-stroke:2px var(--rc);opacity:.16;pointer-events:none;letter-spacing:-.04em;white-space:nowrap;animation:drift 6s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(-50%,-50%) scale(1)}to{transform:translate(-50%,-52%) scale(1.06)}}
.aura{position:absolute;left:50%;top:50%;width:190%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;pointer-events:none;z-index:-1;
  background:repeating-conic-gradient(from 0deg,var(--rc) 0 5deg,transparent 5deg 15deg);-webkit-mask:radial-gradient(circle,#000 18%,transparent 62%);mask:radial-gradient(circle,#000 18%,transparent 62%);animation:spin 14s linear infinite;opacity:var(--ao)}
.aura.rb{background:repeating-conic-gradient(from 0deg,#FF4DD2 0 5deg,transparent 5deg 15deg,#FFD23F 15deg 20deg,transparent 20deg 30deg,#4FFFB0 30deg 35deg,transparent 35deg 45deg,#4FA3FF 45deg 50deg,transparent 50deg 60deg)}
.aura.b2{width:150%;animation-direction:reverse;animation-duration:9s;opacity:calc(var(--ao)*.6)}
@keyframes spin{to{rotate:360deg}}
.stage.cardin{animation:cardin 1.1s cubic-bezier(.2,1.1,.3,1) both}
@keyframes cardin{0%{transform:perspective(900px) translateY(30px) scale(.2) rotateY(-720deg);opacity:0;filter:brightness(5) saturate(0)}55%{filter:brightness(2.2)}100%{transform:none;opacity:1;filter:none}}
.rname{position:relative}
.rname .ch{display:inline-block;animation:slam .5s cubic-bezier(.2,1.8,.4,1) both;animation-delay:calc(.55s + var(--i)*.05s)}
@keyframes slam{from{transform:scale(3.5) translateY(-20px);opacity:0;filter:blur(6px)}}
.rname.rb .ch{background:linear-gradient(90deg,#FF4DD2,#FFD23F,#4FFFB0,#4FA3FF,#B06BFF,#FF4DD2);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:slam .5s cubic-bezier(.2,1.8,.4,1) both,rbmove 2.5s linear infinite;animation-delay:calc(.55s + var(--i)*.05s),0s}
@keyframes rbmove{to{background-position:300% 0}}
.rname.glitch{animation:glitch 2.2s steps(1) infinite}
@keyframes glitch{0%,86%,100%{text-shadow:none;transform:none}88%{text-shadow:-4px 0 #FF2BD6,4px 0 #2BF0FF;transform:skewX(-10deg)}91%{text-shadow:5px 0 #FF2BD6,-5px 0 #2BF0FF;transform:translateX(4px)}94%{text-shadow:-2px 0 #FF2BD6,2px 0 #2BF0FF;transform:none}}
.rname small{opacity:0;animation:showup .4s 1.2s forwards}
@keyframes showup{to{opacity:1}}
.saveimg{border-color:color-mix(in srgb,var(--gold) 60%,var(--line))}
.namebox .pvwrap{display:grid;justify-items:center;gap:6px;padding-top:6px}
.namebox .pv{width:min(52vw,210px)}
.shot{position:fixed;inset:0;z-index:80;background:rgba(5,7,18,.92);display:grid;place-items:center;align-content:center;gap:12px;padding:20px 16px}
.shot img{max-width:min(86vw,420px);max-height:70vh;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.6);-webkit-touch-callout:default;user-select:auto}

function noise(dur,vol,when=0,f0=3000,f1=200){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const n=actx.sampleRate*dur,b=actx.createBuffer(1,n,actx.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n)**2;
  const s=actx.createBufferSource(),f=actx.createBiquadFilter(),g=actx.createGain(),t=actx.currentTime+when;s.buffer=b;f.type='lowpass';f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.value=vol;s.connect(f).connect(g).connect(actx.destination);s.start(t)}catch(e){}}
function sweep(f0,f1,dur,vol=.05,type='sawtooth'){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain(),f=actx.createBiquadFilter();
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);f.type='lowpass';f.frequency.value=1800;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(vol,t+dur*.9);g.gain.exponentialRampToValueAtTime(.001,t+dur+.05);
  o.connect(f).connect(g).connect(actx.destination);o.start(t);o.stop(t+dur+.1)}catch(e){}}
Object.assign(sfx,{
  ping:i=>{const f=[523,659,784,1047,1319][i];tone(f,.12,'square',0,.05);tone(f*2,.2,'sine',.02,.04)},
  boom:t=>{noise(.9,.35+t*.05);tone(70,.5,'sine',0,.3);tone(55,.7,'sine',.05,.2);
    const ch=[[523,659,784],[523,659,784,1047],[587,740,880,1175],[659,831,988,1319,1661],[523,659,784,1047,1319,1568]][t];
    ch.forEach((f,i)=>{tone(f,.5+t*.15,'triangle',.12+i*.06,.06);if(t>=2)tone(f,.9+t*.2,'sine',.12+ch.length*.06+.1,.035)})}
});
let RV=null;
const buzz=p=>{try{navigator.userActivation?.hasBeenActive!==false&&navigator.vibrate?.(p)}catch(e){}};
const rcol=i=>i>=4?'#FFFFFF':RHEX[i];
function openSeal(){
  if(RV)return;const ep=S.cards[S.cards.length-1],t=ep.tier,seal=$('.seal');if(!seal)return;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  RV={t,timers:[]};const at=(ms,fn)=>RV.timers.push(setTimeout(fn,ms));
  if(reduce){burst();return}
  const dim=document.createElement('div');dim.className='rv-dim';document.body.appendChild(dim);RV.dim=dim;
  seal.insertAdjacentHTML('beforeend','<span class="cr"></span>');
  seal.style.setProperty('--rc',rcol(0));seal.dataset.lv=0;seal.classList.add('charging');
  const box=()=>seal.getBoundingClientRect(),ctr=()=>{const r=box();return[r.left+r.width/2,r.top+r.height/2]};
  const step=t>=3?430:380,charge=320+(t+1)*step;
  sweep(110,260+t*170,charge/1000,.045);
  for(let k=0;k<charge;k+=110)at(k,()=>{const[x,y]=ctr();FX.converge(x,y,rcol(+seal.dataset.lv),5+t*2)});
  for(let i=0;i<=t;i++)at(240+i*step,()=>{seal.style.setProperty('--rc',rcol(i));seal.dataset.lv=i;sfx.ping(i);const[x,y]=ctr();FX.ring(x,y,i>=3?RAINBOW[i%5]:rcol(i),200+i*40,6+i*2,32);buzz(20+i*10)});
  let tb=charge+120;
  if(t>=3){at(tb,()=>{dim.classList.add('black');seal.style.visibility='hidden';const q=document.createElement('div');q.className='qmark';q.textContent=t>=4?'!!?':'!?';document.body.appendChild(q);RV.q=q;tone(1760,.04,'square',0,.04);tone(1760,.04,'square',.18,.04)});tb+=700}
  at(tb,burst);
}
function burst(){
  if(!RV)return;const ep=S.cards[S.cards.length-1],t=ep.tier;RV.timers.forEach(clearTimeout);
  RV.q?.remove();RV.dim?.remove();
  const f=document.createElement('div');f.className='flash';f.style.setProperty('--rc',rcol(t));document.body.appendChild(f);setTimeout(()=>f.remove(),800);
  S.cur.revealed=true;render();
  const st=$('.reveal .stage'),r=st?st.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0},x=r.left+r.width/2,y=r.top+r.height/2;
  const cols=t>=3?RAINBOW.concat('#fff'):[rcol(t),'#fff',rcol(Math.max(0,t-1))];
  FX.burst(x,y,cols,30+t*45);FX.ring(x,y,'#fff',Math.max(innerWidth,innerHeight)*.7,16,45);if(t>=2)setTimeout(()=>FX.ring(x,y,cols[0],Math.max(innerWidth,innerHeight)*.5,10,40),120);
  if(t>=1){$('#app').classList.remove('shake');void $('#app').offsetWidth;$('#app').classList.add('shake');setTimeout(()=>$('#app')?.classList.remove('shake'),600)}
  buzz(t>=3?[60,40,120]:60);
  sfx.boom(t);
  if(t>=2){let n=0;const iv=setInterval(()=>{const s=$('.reveal .stage');if(!s||++n>(t>=3?24:12)){clearInterval(iv);return}FX.sparkle(s.getBoundingClientRect(),cols,2+t)},150)}
  RV=null;
}

function newGame(){
  const total=S.players.length*S.rounds;
  Object.assign(S,{idx:0,total,target:Math.max(1,Math.round(total*.4)),cards:[],redraw:S.players.map(()=>1),
    dE:shuffle(EMO.map(e=>e.id)),dS:shuffle(SCENES.map((_,i)=>i)),dK:shuffle(SKILLS.map(s=>s.id))});

function pull(k,src){if(!S[k].length)S[k]=shuffle(src);return S[k].pop()}
const pullE=()=>pull('dE',EMO.map(e=>e.id)),pullS=()=>pull('dS',SCENES.map((_,i)=>i));
function startTurn(){
  const skill=S.idx>0&&Math.random()<.4?pull('dK',SKILLS.map(s=>s.id)):null;
  S.cur={emo:pullE(),scene:pullS(),skill,fE:false,fS:false,phase:'draw',chips:shuffle(QUESTIONS).slice(0,6),asked:[],own:0,boost:false,timer:null,title:'',memo:'',revealed:false};
  setGlow('#4FA3FF');
}

  if('closeBg' in d&&e.target!==t)return;
  if('shotclose' in d){t.closest('.shot')?.remove();return}
  if(d.save){const ep=d.save==='modal'?(S.modal.src==='file'?(store('hd.cards')||[])[S.modal.i]:S.cards[S.modal.i]):S.cards[S.cards.length-1];if(ep)saveCard(ep,t);return}
  if('closeBg' in d||'close' in d){S.modal=null;render();return}
  if(d.go){S.screen=d.go;S.modal=null;if(d.go!=='play')setGlow();render();scrollTo({top:0});return}
  if('add' in d){S.players.push('');render();$('#pname'+(S.players.length-1))?.focus();return}
  if(d.del){S.players.splice(+d.del,1);render();return}
  if(d.rounds){S.rounds=+d.rounds;render();return}
  if('start' in d){S.players=S.players.map((p,i)=>p.trim()||`P${i+1}`);store('hd.setup',{players:S.players,rounds:S.rounds});newGame();S.screen='play';keepAwake();sfx.up(3);render();scrollTo({top:0});return}
  if(d.filter){S.filter=d.filter;render();return}
  if(d.openCard!==undefined){S.modal={i:+d.openCard,src:d.src};render();return}
  if('askdel' in d){$('#delbox').innerHTML=`<div class="confirm"><p>このカードを消しますか？ もとには戻せません。</p><div class="row"><button class="btn" data-close>やめる</button><button class="btn" data-dodel style="border-color:#FF4D6D;color:#FF8FA3">消す</button></div></div>`;return}
  if('dodel' in d){const l=store('hd.cards')||[];l.splice(S.modal.i,1);store('hd.cards',l);S.modal=null;render();return}
  const c=S.cur;if(!c)return;
  if(d.flip){const k='f'+d.flip;if(c[k])return;c[k]=true;sfx.flip();if(d.flip==='E')setGlow(emo(c.emo).c);t.classList.add('flipped');setTimeout(render,700);return}
  if(d.re){S.redraw[S.idx%S.players.length]--;if(d.re==='S')c.scene=pullS();else c.emo=pullE();c['f'+d.re]=false;render();return}
  if('talk' in d){c.phase='talk';render();scrollTo({top:0});return}
  if(d.q!==undefined){const i=+d.q;if(c.asked.includes(i))return;const before=tierOf(depth(),false);c.asked.push(i);t.classList.add('done');bump(before);return}
  if('own' in d){const before=tierOf(depth(),false);c.own++;t.textContent=`＋ 自分で考えた質問 ×${c.own}`;bump(before);return}
  if('boost' in d){c.boost=!c.boost;if(c.boost)sfx.up(3);render();return}
  if('timer' in d){runTimer();return}
  if('fin' in d){clearInterval(timerId);c.phase='name';render();scrollTo({top:0});return}
  if('mint' in d){mint();return}
  if('open' in d){openSeal();return}
  if('next' in d){S.idx++;if(S.idx>=S.total){S.screen='result';setGlow('#FFD23F')}else startTurn();render();scrollTo({top:0});return}
  if('quit' in d){$('#quitbox').innerHTML=`<div class="confirm"><p><b>ゲームをやめますか？</b> できたカードはファイルに残ります。</p><div class="row"><button class="btn" data-quitno>つづける</button><button class="btn go" data-quityes>やめる</button></div></div>`;return}
  if('quitno' in d){$('#quitbox').innerHTML='';return}
  if('quityes' in d){clearInterval(timerId);S.screen='home';setGlow();render();return}
  if('again' in d){newGame();S.screen='play';render();scrollTo({top:0});return}
});
document.addEventListener('input',e=>{const d=e.target.dataset;if(d.name!==undefined)S.players[+d.name]=e.target.value;if(e.target.id==='title'){S.cur.title=e.target.value;clearTimeout(pvT);pvT=setTimeout(()=>{const pv=$('#pv');if(pv)pv.innerHTML=cardHTML(preview(),{hide:true})},120)}if(e.target.id==='memo'){S.cur.memo=e.target.value;const pv=$('#pv');if(pv)pv.innerHTML=cardHTML(preview(),{hide:true})}snap()});
function bump(before){const now=tierOf(depth(),false);$('#meter').innerHTML=meterInner();if(now>before)sfx.up(now);else sfx.tick();snap()}
let timerId=null,pvT=null;
function preview(){const c=S.cur;return{emo:c.emo,scene:c.scene,tier:0,title:c.title.trim(),memo:c.memo.trim(),depth:depth(),boost:false,name:who(),no:'???',date:''}}
function runTimer(){const k=SKILLS.find(s=>s.id===S.cur.skill);S.cur.timer=k.timer;render();sfx.tick();clearInterval(timerId);
  timerId=setInterval(()=>{const c=S.cur;if(!c||c.phase!=='talk'){clearInterval(timerId);return}c.timer--;const el=$('#timer');
   if(el){el.textContent=c.timer;el.classList.toggle('low',c.timer<=5)}if(c.timer<=5&&c.timer>0)sfx.tick();
   if(c.timer<=0){clearInterval(timerId);tone(330,.4,'square',0,.08)}},1000)}
function mint(){
  const c=S.cur,pi=S.idx%S.players.length,dt=new Date();
  const no=(store('hd.no')||0)+1;store('hd.no',no);
  const ep={emo:c.emo,scene:c.scene,depth:depth(),boost:c.boost,tier:tierOf(depth(),c.boost),title:c.title.trim(),memo:c.memo.trim(),name:who(),pi,no,date:`${dt.getMonth()+1}/${dt.getDate()}`};
  S.cards.push(ep);const all=store('hd.cards')||[];all.push(ep);store('hd.cards',all.slice(-500));
  c.phase='reveal';render();scrollTo({top:0});
}
/* カードをなぞると傾いて光る */
document.addEventListener('pointermove',e=>{const el=e.target.closest?.('.tilt');if(!el)return;const r=el.getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
  el.style.setProperty('--ry',((x-.5)*18).toFixed(1)+'deg');el.style.setProperty('--rx',((.5-y)*18).toFixed(1)+'deg');
  el.style.setProperty('--mx',(x*100).toFixed(0)+'%');el.style.setProperty('--my',(y*360).toFixed(0)+'deg')});
document.addEventListener('pointerout',e=>{const el=e.target.closest?.('.tilt');if(el&&!el.contains(e.relatedTarget)){el.style.setProperty('--rx','0deg');el.style.setProperty('--ry','0deg')}});

/* ===== 更新が届いても遊んでいる途中の状態を残す ===== */
function snap(){try{window.claude?.hot?.snapshot?.(()=>({S}))}catch(e){}}
function start(data){if(data&&data.S){S=data.S;if(S.cur&&S.screen==='play'&&S.cur.fE)setGlow(emo(S.cur.emo).c)}render()}
try{document.fonts.ready.then(()=>{ARTC.clear();if(!document.activeElement||document.activeElement===document.body)render()})}catch(e){}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
